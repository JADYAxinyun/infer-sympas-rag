<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>DRaCo + SymPas</title>
<style>
body{font:16px system-ui;max-width:1000px;margin:32px auto;padding:0 20px;color:#1f2937}
h1{color:#174ea6}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}
textarea{width:100%;height:300px;font:14px monospace;padding:10px;box-sizing:border-box}
button{margin-top:10px;padding:9px 18px;background:#174ea6;color:white;border:0;border-radius:5px;cursor:pointer}
pre{background:#f3f6fa;padding:14px;min-height:270px;white-space:pre-wrap}
.hint{color:#64748b}
</style>
<h1>DRaCo + SymPas 演示</h1>
<p class="hint">输入 Python 代码，查看程序切片和返回值检查建议。</p>
<main><section><textarea id="source">def process(x):
    result = load_config(x)
    continue_running()
    return result</textarea><br><button id="run">运行审查</button></section><section><pre id="out">等待分析……</pre></section></main>

<h2>Git Diff 审查</h2>
<textarea id="diff">diff --git a/config.py b/config.py
+++ b/config.py
@@ -1,2 +1,3 @@
+    ret = load_config(path)
+    continue_running()</textarea><br><button id="run-diff">审查 Diff</button>

<h2>Infer 报告</h2>
<textarea id="infer">[{"bug_type":"DEAD_STORE","file":"data_dependency.c","line":2,"qualifier":"unused","severity":"warning"}]</textarea><br><button id="run-infer">解析 Infer 报告</button>
<script>
document.querySelector('#run').onclick=async()=>{
  const out=document.querySelector('#out'); out.textContent='分析中……';
  try{const source=document.querySelector('#source').value; const [slice,review]=await Promise.all(['/slice','/review'].map(path=>fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source})}).then(r=>r.json()))); out.textContent=JSON.stringify({slice,review},null,2)}
  catch(e){out.textContent='请求失败：'+e}
};

document.querySelector('#run-diff').onclick=async()=>{
  const out=document.querySelector('#out'); out.textContent='分析 Diff 中……';
  try{const r=await fetch('/review-diff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({diff:document.querySelector('#diff').value})}); out.textContent=JSON.stringify(await r.json(),null,2)}
  catch(e){out.textContent='请求失败：'+e}
};

document.querySelector('#run-infer').onclick=async()=>{
  const out=document.querySelector('#out'); out.textContent='解析 Infer 报告中……';
  try{const r=await fetch('/infer-report',{method:'POST',headers:{'Content-Type':'application/json'},body:document.querySelector('#infer').value}); out.textContent=JSON.stringify(await r.json(),null,2)}
  catch(e){out.textContent='请求失败：'+e}
};
</script>
